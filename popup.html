<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Social Video Downloader</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>⬇ Social Video Downloader</h1>
    <div class="subtitle">Instagram · X</div>

    <label for="links" class="hint">Cole os links abaixo. Linhas com # são ignoradas.</label>
    <textarea id="links" spellcheck="false" placeholder="https://www.instagram.com/reel/XXXXXXXXXXX/&#10;https://x.com/usuario/status/1234567890"></textarea>
    <div class="hint help">Um link por linha · Instagram e X suportados</div>

    <div class="tabs-row">
      <button id="addCurrent" class="small">＋ Aba atual</button>
      <button id="addAll" class="small">＋ Todas as abas</button>
      <span id="tabsMsg" class="hint"></span>
    </div>

    <div class="buttons">
      <button id="start" class="primary">Baixar vídeos</button>
      <button id="stop" class="danger" disabled>Parar</button>
      <button id="clear">Limpar</button>
    </div>

    <div id="log" class="log" aria-live="polite"></div>
    <div id="summary" class="summary"></div>

    <script src="popup.js"></script>
  </body>
</html>
