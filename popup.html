<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Instagram Downloader</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>⬇ Instagram Downloader</h1>

    <label for="links" class="hint">Cole os links (reels, posts, stories), um por linha. Linhas com # são ignoradas.</label>
    <textarea id="links" spellcheck="false" placeholder="https://www.instagram.com/reel/XXXXXXXXXXX/"></textarea>

    <div class="buttons">
      <button id="start" class="primary">Baixar vídeos</button>
      <button id="stop" class="danger" disabled>Parar</button>
      <button id="clear">Limpar</button>
    </div>

    <div id="log" class="log" aria-live="polite"></div>
    <div id="summary" class="summary"></div>

    <script src="popup.js"></script>
  </body>
</html>
